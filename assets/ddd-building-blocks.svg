<svg width="700" height="340" viewBox="0 0 700 340" xmlns="http://www.w3.org/2000/svg" role="img">
<title>DDD building blocks</title>
<desc>Shows a bounded context containing an Order aggregate with Order as the aggregate root, entities and value objects inside it, and a domain event fired when the order is placed, consumed by an external handler.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#E6E6E6;}
.lbl{font-size:12px;font-weight:600;fill:#F5F5F5;}
.sub{font-size:10px;fill:#C9C9C9;}
.entity{fill:#241E3D;stroke:#8C7DE0;stroke-width:1;}
.vo{fill:#173829;stroke:#4CAF8C;stroke-width:1;}
.root{fill:#3A2A10;stroke:#E0A33D;stroke-width:2;}
.event{fill:#3A1E1E;stroke:#D97070;stroke-width:1;}
line{stroke:#9CA3AF;stroke-width:1.3;marker-end:url(#a3);}
</style>
<defs><marker id="a3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#9CA3AF" stroke-width="1.5"/></marker></defs>
<rect x="0" y="0" width="700" height="340" fill="#0D1117"/>

<rect x="20" y="20" width="420" height="260" rx="10" fill="none" stroke="#5F5E5A" stroke-width="1" stroke-dasharray="6,4"/>
<text class="sub" x="40" y="42">Bounded Context: "Sales"</text>

<rect x="45" y="60" width="370" height="200" rx="8" fill="none" stroke="#E0A33D" stroke-width="1" stroke-dasharray="4,3"/>
<text class="sub" x="60" y="80" fill="#E0A33D">Aggregate: Order</text>

<rect class="root" x="70" y="95" width="140" height="46" rx="8"/>
<text class="lbl" x="140" y="112" text-anchor="middle" font-size="11">Order</text>
<text class="sub" x="140" y="128" text-anchor="middle">(aggregate root)</text>

<rect class="entity" x="240" y="95" width="150" height="40" rx="8"/>
<text class="lbl" x="315" y="115" text-anchor="middle" font-size="10.5">OrderItem (entity)</text>

<rect class="vo" x="70" y="165" width="140" height="40" rx="8"/>
<text class="lbl" x="140" y="185" text-anchor="middle" font-size="10.5">Money (value object)</text>

<rect class="vo" x="240" y="165" width="150" height="40" rx="8"/>
<text class="lbl" x="315" y="185" text-anchor="middle" font-size="10.5">Address (value object)</text>

<line x1="210" y1="118" x2="240" y2="115"/>
<line x1="140" y1="141" x2="140" y2="165"/>
<line x1="315" y1="135" x2="315" y2="165"/>

<text class="sub" x="230" y="240" text-anchor="middle">External code only ever talks to Order — never reaches into OrderItem/Money directly</text>

<rect class="event" x="480" y="95" width="180" height="46" rx="8"/>
<text class="lbl" x="570" y="112" text-anchor="middle" font-size="11">OrderPlacedEvent</text>
<text class="sub" x="570" y="128" text-anchor="middle">domain event</text>

<line x1="210" y1="118" x2="480" y2="118" stroke-dasharray="3,3"/>
<text class="sub" x="440" y="108">fires</text>

<rect class="entity" x="480" y="180" width="180" height="40" rx="8"/>
<text class="lbl" x="570" y="200" text-anchor="middle" font-size="10.5">InventoryHandler</text>
<line x1="570" y1="141" x2="570" y2="180"/>
<text class="sub" x="600" y="165">handles</text>
</svg>
