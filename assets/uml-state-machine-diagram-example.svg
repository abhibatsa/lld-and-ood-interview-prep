<svg width="640" height="260" viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" role="img">
<title>UML state machine diagram example</title>
<desc>Shows a state machine for an order: Placed transitions to Confirmed or Cancelled, Confirmed transitions to Shipped or Cancelled, and Shipped transitions to Delivered, showing that Cancelled is reachable from multiple states, an edge case easy to miss.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#E6E6E6;}
.lbl{font-size:11px;font-weight:600;fill:#F5F5F5;}
.evt{font-size:9px;fill:#C9C9C9;}
.state{fill:#241E3D;stroke:#8C7DE0;stroke-width:1;}
.cancel{fill:#3A1E1E;stroke:#D97070;stroke-width:1;}
line{stroke:#9CA3AF;stroke-width:1.2;marker-end:url(#a2);}
</style>
<defs><marker id="a2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#9CA3AF" stroke-width="1.5"/></marker></defs>
<rect x="0" y="0" width="640" height="260" fill="#0D1117"/>

<circle cx="30" cy="60" r="8" fill="#4CAF8C"/>
<line x1="38" y1="60" x2="80" y2="60"/>

<rect class="state" x="80" y="40" width="110" height="40" rx="20"/>
<text class="lbl" x="135" y="64" text-anchor="middle" font-size="11">Placed</text>

<line x1="190" y1="60" x2="290" y2="60"/>
<text class="evt" x="200" y="52">confirm</text>
<rect class="state" x="290" y="40" width="130" height="40" rx="20"/>
<text class="lbl" x="355" y="64" text-anchor="middle" font-size="11">Confirmed</text>

<line x1="420" y1="60" x2="510" y2="60"/>
<text class="evt" x="435" y="52">ship</text>
<rect class="state" x="510" y="40" width="110" height="40" rx="20"/>
<text class="lbl" x="565" y="64" text-anchor="middle" font-size="11">Shipped</text>

<line x1="565" y1="80" x2="565" y2="140"/>
<text class="evt" x="475" y="115">deliver</text>
<rect class="state" x="500" y="140" width="130" height="40" rx="20"/>
<text class="lbl" x="565" y="164" text-anchor="middle" font-size="10.5">Delivered</text>

<rect class="cancel" x="220" y="170" width="140" height="40" rx="20"/>
<text class="lbl" x="290" y="194" text-anchor="middle" font-size="11">Cancelled</text>

<line x1="135" y1="80" x2="240" y2="170"/>
<text class="evt" x="150" y="130">cancel</text>
<line x1="355" y1="80" x2="300" y2="170"/>
<text class="evt" x="340" y="130">cancel</text>

<text class="evt" x="320" y="235" text-anchor="middle">Cancelled is reachable from two different states — a common missed edge case if you don't draw this diagram first.</text>
</svg>
