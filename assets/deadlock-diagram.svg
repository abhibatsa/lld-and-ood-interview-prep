<svg width="560" height="380" viewBox="0 0 560 380" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Deadlock: circular wait</title>
<desc>Shows two threads and two locks in a circular wait: Thread A holds Lock 1 and waits for Lock 2, while Thread B holds Lock 2 and waits for Lock 1, forming a cycle where neither can proceed.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#E6E6E6;}
.lbl{font-size:12px;font-weight:600;fill:#F5F5F5;}
.sub{font-size:10px;fill:#C9C9C9;}
.thread{fill:#241E3D;stroke:#8C7DE0;stroke-width:1;}
.lockbox{fill:#3A2A10;stroke:#E0A33D;stroke-width:1;}
.hold{stroke:#4CAF8C;stroke-width:1.5;marker-end:url(#a6);}
.wait{stroke:#D97070;stroke-width:1.5;stroke-dasharray:4,3;marker-end:url(#a7);}
</style>
<defs>
<marker id="a6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#4CAF8C" stroke-width="1.5"/></marker>
<marker id="a7" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#D97070" stroke-width="1.5"/></marker>
</defs>
<rect x="0" y="0" width="560" height="380" fill="#0D1117"/>

<rect class="thread" x="60" y="50" width="140" height="50" rx="8"/>
<text class="lbl" x="130" y="75" text-anchor="middle" font-size="12">Thread A</text>

<rect class="thread" x="360" y="280" width="140" height="50" rx="8"/>
<text class="lbl" x="430" y="305" text-anchor="middle" font-size="12">Thread B</text>

<rect class="lockbox" x="360" y="50" width="140" height="50" rx="8"/>
<text class="lbl" x="430" y="75" text-anchor="middle" font-size="12">Lock 2</text>

<rect class="lockbox" x="60" y="280" width="140" height="50" rx="8"/>
<text class="lbl" x="130" y="305" text-anchor="middle" font-size="12">Lock 1</text>

<line class="hold" x1="130" y1="280" x2="130" y2="100"/>
<text class="sub" x="75" y="195">holds</text>

<line class="hold" x1="430" y1="100" x2="430" y2="280"/>
<text class="sub" x="440" y="195">holds</text>

<line class="wait" x1="200" y1="75" x2="360" y2="75"/>
<text class="sub" x="280" y="65">waits for</text>

<line class="wait" x1="360" y1="305" x2="200" y2="305"/>
<text class="sub" x="280" y="325">waits for</text>

<text class="sub" x="280" y="345" text-anchor="middle">Neither thread can proceed — this cycle is the</text>
<text class="sub" x="280" y="362" text-anchor="middle">"circular wait" condition. Fix: consistent lock acquisition order.</text>
</svg>
