<svg width="700" height="320" viewBox="0 0 700 320" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Layered vs Hexagonal architecture</title>
<desc>Shows Layered Architecture as three horizontal bands, Controller depending on Service depending on Repository, versus Hexagonal Architecture as concentric circles with the domain core in the middle and adapters plugging in around the edge through ports.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#E6E6E6;}
.lbl{font-size:12px;font-weight:600;fill:#F5F5F5;}
.sub{font-size:10px;fill:#C9C9C9;}
.layer{fill:#241E3D;stroke:#8C7DE0;stroke-width:1;}
line{stroke:#9CA3AF;stroke-width:1.3;marker-end:url(#a4);}
</style>
<defs><marker id="a4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#9CA3AF" stroke-width="1.5"/></marker></defs>
<rect x="0" y="0" width="700" height="320" fill="#0D1117"/>

<text class="lbl" x="150" y="26" text-anchor="middle" font-size="13">Layered</text>
<rect class="layer" x="30" y="45" width="240" height="50" rx="6"/>
<text class="lbl" x="150" y="70" text-anchor="middle" font-size="11">Controller</text>
<line x1="150" y1="95" x2="150" y2="120"/>
<rect class="layer" x="30" y="120" width="240" height="50" rx="6"/>
<text class="lbl" x="150" y="145" text-anchor="middle" font-size="11">Service</text>
<line x1="150" y1="170" x2="150" y2="195"/>
<rect class="layer" x="30" y="195" width="240" height="50" rx="6"/>
<text class="lbl" x="150" y="220" text-anchor="middle" font-size="11">Repository</text>
<text class="sub" x="150" y="270" text-anchor="middle">Dependencies point straight down,</text>
<text class="sub" x="150" y="286" text-anchor="middle">one layer at a time</text>

<text class="lbl" x="510" y="26" text-anchor="middle" font-size="13">Hexagonal / Clean</text>
<circle cx="510" cy="160" r="120" fill="none" stroke="#5F5E5A" stroke-width="1" stroke-dasharray="4,3"/>
<circle cx="510" cy="160" r="60" fill="#3A2A10" stroke="#E0A33D" stroke-width="1.5"/>
<text class="lbl" x="510" y="156" text-anchor="middle" font-size="11">Domain</text>
<text class="lbl" x="510" y="172" text-anchor="middle" font-size="11">Core</text>

<rect class="layer" x="470" y="15" width="80" height="34" rx="6"/>
<text class="sub" x="510" y="36" text-anchor="middle">REST API</text>
<line x1="510" y1="49" x2="510" y2="100"/>

<rect class="layer" x="595" y="140" width="90" height="34" rx="6"/>
<text class="sub" x="640" y="161" text-anchor="middle">SQL Adapter</text>
<line x1="595" y1="157" x2="570" y2="160"/>

<rect class="layer" x="335" y="140" width="90" height="34" rx="6"/>
<text class="sub" x="380" y="161" text-anchor="middle">Test Stub</text>
<line x1="425" y1="157" x2="450" y2="160"/>

<rect class="layer" x="470" y="270" width="80" height="34" rx="6"/>
<text class="sub" x="510" y="291" text-anchor="middle">Message Bus</text>
<line x1="510" y1="270" x2="510" y2="220"/>

<text class="sub" x="510" y="308" text-anchor="middle" font-size="9.5">All arrows point inward — the core never depends on the outside</text>
</svg>
