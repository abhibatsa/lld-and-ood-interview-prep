<svg width="620" height="320" viewBox="0 0 620 320" xmlns="http://www.w3.org/2000/svg" role="img">
<title>UML sequence diagram example</title>
<desc>Shows a sequence diagram for placing an order: Client calls OrderService.placeOrder, which calls Inventory.reserve, then PaymentService.charge, and returns a confirmation back to the Client, with vertical lifelines showing time flowing downward.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#E6E6E6;}
.lbl{font-size:11px;font-weight:600;fill:#F5F5F5;}
.msg{font-size:10px;fill:#C9C9C9;}
.lifeline{stroke:#8C7DE0;stroke-width:1;stroke-dasharray:4,3;}
.box{fill:#241E3D;stroke:#8C7DE0;stroke-width:1;}
.call{stroke:#4CAF8C;stroke-width:1.3;marker-end:url(#arrowG);}
.ret{stroke:#E0A33D;stroke-width:1.3;stroke-dasharray:3,3;marker-end:url(#arrowA);}
</style>
<defs>
<marker id="arrowG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#4CAF8C" stroke-width="1.5"/></marker>
<marker id="arrowA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#E0A33D" stroke-width="1.5"/></marker>
</defs>
<rect x="0" y="0" width="620" height="320" fill="#0D1117"/>
<text class="lbl" x="310" y="22" text-anchor="middle" font-size="13">Sequence: placing an order (time flows downward)</text>

<rect class="box" x="20" y="35" width="100" height="30" rx="4"/><text class="lbl" x="70" y="54" text-anchor="middle" font-size="10">Client</text>
<line class="lifeline" x1="70" y1="65" x2="70" y2="290"/>

<rect class="box" x="180" y="35" width="120" height="30" rx="4"/><text class="lbl" x="240" y="54" text-anchor="middle" font-size="10">OrderService</text>
<line class="lifeline" x1="240" y1="65" x2="240" y2="290"/>

<rect class="box" x="360" y="35" width="100" height="30" rx="4"/><text class="lbl" x="410" y="54" text-anchor="middle" font-size="10">Inventory</text>
<line class="lifeline" x1="410" y1="65" x2="410" y2="290"/>

<rect class="box" x="500" y="35" width="100" height="30" rx="4"/><text class="lbl" x="550" y="54" text-anchor="middle" font-size="10">Payment</text>
<line class="lifeline" x1="550" y1="65" x2="550" y2="290"/>

<line class="call" x1="70" y1="90" x2="240" y2="90"/>
<text class="msg" x="80" y="83">placeOrder(cart)</text>

<line class="call" x1="240" y1="130" x2="410" y2="130"/>
<text class="msg" x="250" y="123">reserve(items)</text>
<line class="ret" x1="410" y1="155" x2="240" y2="155"/>
<text class="msg" x="260" y="148">ok</text>

<line class="call" x1="240" y1="190" x2="550" y2="190"/>
<text class="msg" x="260" y="183">charge(amount)</text>
<line class="ret" x1="550" y1="215" x2="240" y2="215"/>
<text class="msg" x="270" y="208">charged</text>

<line class="ret" x1="240" y1="250" x2="70" y2="250"/>
<text class="msg" x="90" y="243">orderConfirmation</text>
</svg>
