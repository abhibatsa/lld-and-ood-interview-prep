<svg width="640" height="240" viewBox="0 0 640 240" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Producer-consumer pattern</title>
<desc>Shows two producer threads adding tasks to a bounded blocking queue in the middle, and two consumer threads taking tasks off the queue, decoupling production rate from consumption rate.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#E6E6E6;}
.lbl{font-size:11.5px;font-weight:600;fill:#F5F5F5;}
.sub{font-size:9.5px;fill:#C9C9C9;}
.prod{fill:#173829;stroke:#4CAF8C;stroke-width:1;}
.cons{fill:#241E3D;stroke:#8C7DE0;stroke-width:1;}
.queue{fill:#3A2A10;stroke:#E0A33D;stroke-width:1.5;}
line{stroke:#9CA3AF;stroke-width:1.3;marker-end:url(#a8);}
</style>
<defs><marker id="a8" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#9CA3AF" stroke-width="1.5"/></marker></defs>
<rect x="0" y="0" width="640" height="240" fill="#0D1117"/>

<rect class="prod" x="20" y="40" width="120" height="42" rx="8"/>
<text class="lbl" x="80" y="61" text-anchor="middle" font-size="11">Producer 1</text>
<line x1="140" y1="61" x2="230" y2="90"/>

<rect class="prod" x="20" y="150" width="120" height="42" rx="8"/>
<text class="lbl" x="80" y="171" text-anchor="middle" font-size="11">Producer 2</text>
<line x1="140" y1="171" x2="230" y2="140"/>

<rect class="queue" x="230" y="80" width="180" height="70" rx="8"/>
<text class="lbl" x="320" y="102" text-anchor="middle" font-size="11">Bounded Queue</text>
<rect x="250" y="112" width="22" height="18" fill="#E0A33D" rx="3"/>
<rect x="278" y="112" width="22" height="18" fill="#E0A33D" rx="3"/>
<rect x="306" y="112" width="22" height="18" fill="#E0A33D" rx="3"/>
<text class="sub" x="320" y="145" text-anchor="middle">put() blocks if full</text>

<line x1="410" y1="90" x2="500" y2="61"/>
<rect class="cons" x="500" y="40" width="120" height="42" rx="8"/>
<text class="lbl" x="560" y="61" text-anchor="middle" font-size="11">Consumer 1</text>

<line x1="410" y1="140" x2="500" y2="171"/>
<rect class="cons" x="500" y="150" width="120" height="42" rx="8"/>
<text class="lbl" x="560" y="171" text-anchor="middle" font-size="11">Consumer 2</text>

<text class="sub" x="320" y="200" text-anchor="middle">take() blocks if empty — producers and consumers run at their own pace, decoupled by the queue</text>
</svg>
