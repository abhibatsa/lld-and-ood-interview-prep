<svg width="640" height="260" viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Thread lifecycle states</title>
<desc>Shows the thread lifecycle: New transitions to Runnable, which transitions to Running, which can go back to Runnable or to Blocked/Waiting, which returns to Runnable, and Running eventually transitions to Terminated.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#E6E6E6;}
.lbl{font-size:11.5px;font-weight:600;fill:#F5F5F5;}
.state{fill:#241E3D;stroke:#8C7DE0;stroke-width:1;}
.blocked{fill:#3A1E1E;stroke:#D97070;stroke-width:1;}
.term{fill:#3A2A10;stroke:#E0A33D;stroke-width:1;}
line{stroke:#9CA3AF;stroke-width:1.3;marker-end:url(#a5);}
</style>
<defs><marker id="a5" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#9CA3AF" stroke-width="1.5"/></marker></defs>
<rect x="0" y="0" width="640" height="260" fill="#0D1117"/>

<rect class="state" x="20" y="100" width="90" height="46" rx="8"/>
<text class="lbl" x="65" y="123" text-anchor="middle" font-size="11">New</text>
<line x1="110" y1="123" x2="170" y2="123"/>

<rect class="state" x="170" y="100" width="100" height="46" rx="8"/>
<text class="lbl" x="220" y="123" text-anchor="middle" font-size="11">Runnable</text>
<line x1="270" y1="123" x2="330" y2="123"/>

<rect class="state" x="330" y="100" width="100" height="46" rx="8"/>
<text class="lbl" x="380" y="123" text-anchor="middle" font-size="11">Running</text>

<line x1="330" y1="112" x2="270" y2="112" marker-end="url(#a5)"/>
<text class="lbl" x="290" y="102" font-size="9" font-weight="400">yields/preempted</text>

<line x1="380" y1="146" x2="380" y2="190"/>
<rect class="blocked" x="310" y="190" width="140" height="46" rx="8"/>
<text class="lbl" x="380" y="213" text-anchor="middle" font-size="10.5">Blocked/Waiting</text>
<line x1="310" y1="205" x2="220" y2="146" marker-end="url(#a5)"/>
<text class="lbl" x="240" y="180" font-size="9" font-weight="400">lock released</text>

<line x1="430" y1="123" x2="500" y2="123"/>
<rect class="term" x="500" y="100" width="120" height="46" rx="8"/>
<text class="lbl" x="560" y="123" text-anchor="middle" font-size="11">Terminated</text>

<text class="lbl" x="320" y="255" text-anchor="middle" font-size="10" font-weight="400" fill="#B4B4B4">A thread can cycle Runnable ↔ Running ↔ Blocked many times before Terminated — that's normal.</text>
</svg>
